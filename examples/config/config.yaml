# .sdd/config.yaml — SSOT de parametrizacion del proyecto.
#
# Este ejemplo reproduce los parametros del proyecto de referencia
# (evaluador-flujo-intent) para demostrar el dogfooding. Copialo a
# .sdd/config.yaml en tu proyecto y ajustalo, o generalo con `sdd-configure`.

project:
  name: mi-proyecto
  domain: descripcion corta del dominio del proyecto
  language: python              # python | none (node/go: roadmap)
  # default_branch: main        # rama de disparo del CI; sdd-init la detecta

dirs:
  domain: src/domain
  application: src/application
  adapters: src/adapters
  ui: src/dashboard
  tests_unit: tests/unit            # la corre el paso `tests`
  tests_integration: tests/integration  # la corre el paso `integration`
  # tests_e2e: tests/e2e            # la corre el paso `e2e`. Los pasos estaticos
                                    # (naming/lint/format) la miran; `coverage` no
                                    # la ejecuta: una suite que maneja el producto
                                    # por subproceso no aporta lineas medidas.
  # source_roots: [src]         # opcional; por defecto = top-level de las capas

specs:
  # Triage de solape: antes de crear una spec, `sdd-spec` avisa cuales de las
  # vigentes podrian estar cubriendo ya la capacidad, por titulo o porque ya
  # gobiernan los archivos que vas a tocar (SPEC-022 US2). Al haber candidatas
  # aborta, y hay que resolver el solape a mano: `--reuse SPEC-NNN --fr FR-NNN`
  # para adoptar una, o `--new --rationale="..."` para dejar escrito por que no
  # cabe en ninguna. Toda la seccion es OPCIONAL: sin ella rigen los defaults.
  triage:
    # IMPORTANTE: sembra esto con el vocabulario de TU dominio. Son las palabras
    # que aparecen en casi todos los titulos y que, por comunes, no dicen nada
    # sobre si dos specs se solapan; sin ellas el triage marca candidata a media
    # docena de specs y se vuelve ruido que se aprende a ignorar.
    stopwords: []
    min_word_len: 4       # palabras mas cortas que esto no se comparan
    min_matches: 2        # palabras en comun para marcar candidata por titulo

naming:
  # Palabras excluidas de identificadores de codigo (ver templates SPEC-000).
  prohibited:
    - watson
    - orchestrate
    - ibm
    - azure
    - aws
    - openai
    - anthropic
    - bedrock
    - streamlit
    - flask
    - fastapi
    - django
    - gradio
    - csv
    - json
    - xml
    - yaml
    - parquet
    - oauth
    - iam
    - jwt
    - apikey
  allowed_identifiers:
    - json                      # contrato de requests.Response.json()
  relax_in_tests:               # palabras excluidas toleradas en tests/
    - csv
    - json
    - xml
    - yaml
    - parquet

constitution:
  # Metadatos de CONSTITUTION.md (generado por render.py). El procedimiento de
  # enmienda que el propio documento describe consiste en bumpear esto y
  # regenerar. Si omitis la seccion, se usan 0.1.0 y la fecha de hoy.
  version: "0.1.0"
  ratified: 2026-01-01
  amended: 2026-01-01

principles:
  # Los cuatro primeros son el NUCLEO MINIMO obligatorio del kit.
  #
  # `step` (opcional) nombra el paso de pipeline.steps que activa el enforcement:
  # check_constitution.py verifica que ese paso este cableado (SPEC-020). Vale
  # para CUALQUIER enforcement, incluido uno propio: si declaras
  # `enforcement: mi_check.py` + `step: mi-paso`, el paso tiene que estar en
  # pipeline.steps o la constitucion falla. Omitir `step` declara un enforcement
  # que el pipeline no activa -- ver el principio IV (hooks) y el VI (convencion).
  - id: I
    title: Nomenclatura agnostica a tecnologia
    invariant: Ningun identificador de codigo nombra proveedor, UI, formato o auth.
    enforcement: check_naming.py
    step: naming
    detail: specs/SPEC-000-naming.md
  - id: II
    title: Capas limpias con dependencia unidireccional
    invariant: El dominio es puro; las dependencias apuntan al dominio.
    enforcement: lint-imports
    step: layers
    detail: docs/ARCHITECTURE.md
  - id: III
    title: Trazabilidad spec-codigo
    invariant: Toda capacidad tiene spec registrada antes de implementar.
    enforcement: check_traceability.py
    step: traceability
    detail: specs/SPECS_REGISTRY.md
  - id: IV
    title: Gate spec-first
    invariant: No se edita codigo fuente sin una spec vigente declarada.
    # Sin `step`: el gate se cablea via hooks, no como paso del pipeline; su
    # presencia la verifica sdd-doctor.
    enforcement: sdd_gate.py
    detail: docs/SDD-ENFORCEMENT.md
  # A partir de aca, principios OPCIONALES: elegi los que apliquen a tu
  # proyecto y borra el resto. No tienen por que enforzarse con una tool: sin
  # `step`, el principio se verifica en code review.
  - id: V
    title: Datos no versionados
    invariant: El repo contiene codigo y specs, no datasets.
    enforcement: .gitignore
    detail: docs/ARCHITECTURE.md
  - id: VI
    title: SSOT unico por tema
    invariant: >-
      Toda pieza de informacion normativa —regla, definicion, cifra, tabla,
      convencion— vive en exactamente un documento, su SSOT; cualquier otro que
      la necesite la referencia, nunca la reproduce. El mismo invariante rige
      dentro de un documento: un detalle compartido por varias secciones se
      declara una vez y las secciones lo referencian.
    enforcement: AGENTS.md
    detail: 00-INDEX.md

layers:
  # capa: [capas que PUEDE importar]. Genera los contratos de import-linter.
  domain: []
  application: [domain]
  adapters: [domain, application]
  ui: [domain, application, adapters]

pipeline:
  # Pasos del pipeline local. Los de proceso (constitution/traceability/gate/
  # skills) son agnosticos; naming/layers/lint/types/security/tests/coverage los
  # provee el adaptador del lenguaje activo.
  #
  # `constitution` va DESPUES de los pasos que enforzan principios (los `step:`
  # declarados arriba) y despues de `render`, su precondicion: ademas de
  # verificar que cada enforcement este declarado, verifica que haya CORRIDO
  # (SPEC-020 US2). Declararlo antes no rompe nada, pero el paso reporta sus
  # principios "sin enforcement ejecutado" en cada corrida.
  #
  # Ojo al editar esta lista: el instalador la reemplaza entera y corta en la
  # primera linea que no sea un item, asi que los comentarios van aca arriba y
  # no intercalados entre los pasos.
  steps:
    - hooks
    - traceability
    - naming
    - layers
    - lint
    - format
    - types
    - security
    - skills
    - tests
    - integration    # corre dirs.tests_integration; sin esa clave, se omite
    - coverage
    - constitution
    # - e2e         # corre dirs.tests_e2e; sin esa clave, se omite. Va ultimo:
                    # es el paso mas caro del ciclo.

  # Umbrales de cobertura (OPCIONAL). Cada entrada mide sus `paths` juntas
  # contra `min`. Sin esta clave, el paso `coverage` se omite con aviso: un
  # proyecto recien instalado no arranca en ROJO por una metrica que todavia no
  # tiene sentido medir.
  #
  # No hace falta inventar el numero: en cuanto tengas suite, corre
  #   python tools/sdd/core/sdd_coverage_baseline.py
  # que mide el piso real y lo escribe aca como trinquete (SPEC-009 FR-US2-003).
  # Si ya declaraste umbrales, no los toca: te dice si quedaron por debajo del
  # piso, o sea si dejaron de morder.
  #
  # El patron util es exigirle mas al nucleo que al resto:
  # coverage:
  #   - paths: [src]
  #     min: 80
  #   - paths: [src/domain]
  #     min: 96
