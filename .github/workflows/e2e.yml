# Escrito a mano, a diferencia de `ci.yml` (SPEC-018 FR-US2-005).
#
# `core/render.py` genera el workflow universal que reciben los derivados: ese
# job invoca `core/pipeline.py` y nada mas. La suite e2e es especifica del kit
# —verifica el producto instalado— y no debe contaminar ese generador.
#
# Corre en Linux y en Windows a proposito: los defectos de esta clase suelen ser
# de plataforma (rutas, permisos, codificacion de consola).
name: e2e (sdd-first)

on:
  push:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - "tests/fixtures_proyecto.py"
      - "core/**"
      - "adapters/**"
      - "templates/**"
      - ".sdd/config.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "tests/e2e/**"
      - "tests/fixtures_proyecto.py"
      - "core/**"
      - "adapters/**"
      - "templates/**"
      - ".sdd/config.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  escenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Sin esto, un runner sin `pre-commit` utilizable daria verde omitiendo
      # justo los escenarios de commits reales.
      SDD_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # `pre-commit install` construye entornos aislados por hook: sin cache,
      # cada corrida los baja de nuevo.
      - name: Cachear entornos de pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        shell: bash

      - name: Identidad git para los commits de los escenarios
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "e2e@sdd-first.invalid"
          git config --global user.name "Suite e2e"
        shell: bash

      # La suite e2e no la miran los pasos del pipeline (no esta declarada en
      # `dirs`), asi que su lint se corre aca, explicito.
      - name: Lint de la suite
        run: python -m ruff check tests/e2e tests/fixtures_proyecto.py
        shell: bash

      - name: Escenarios e2e
        run: python -m pytest tests/e2e -q
        shell: bash
