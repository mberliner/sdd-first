# Escrito a mano, a diferencia de `ci.yml` (SPEC-018 FR-US2-005).
#
# `core/render.py` genera el workflow universal que reciben los derivados: ese
# job invoca `core/pipeline.py` y nada mas. La suite e2e es especifica del kit
# —verifica el producto instalado— y no debe contaminar ese generador.
#
# Corre en Linux y en Windows a proposito: los defectos de esta clase suelen ser
# de plataforma (rutas, permisos, codificacion de consola).
name: e2e (sdd-first)

on:
  push:
    branches: [main]
    paths:
      - "tests/e2e/**"
      - "tests/fixtures_proyecto.py"
      - "core/**"
      - "adapters/**"
      - "templates/**"
      - ".sdd/config.yaml"
      - ".github/workflows/e2e.yml"
  pull_request:
    paths:
      - "tests/e2e/**"
      - "tests/fixtures_proyecto.py"
      - "core/**"
      - "adapters/**"
      - "templates/**"
      - ".sdd/config.yaml"
      - ".github/workflows/e2e.yml"

jobs:
  escenarios:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    env:
      # Sin esto, un runner sin `pre-commit` utilizable daria verde omitiendo
      # justo los escenarios de commits reales.
      SDD_E2E_STRICT: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      # `pre-commit install` construye entornos aislados por hook: sin cache,
      # cada corrida los baja de nuevo.
      - name: Cachear entornos de pre-commit
        uses: actions/cache@v4
        with:
          path: ~/.cache/pre-commit
          key: pre-commit-${{ matrix.os }}-${{ hashFiles('.pre-commit-config.yaml') }}

      - name: Instalar dependencias
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml
          if [ -f requirements-dev.txt ]; then pip install -r requirements-dev.txt; fi
        shell: bash

      - name: Identidad git para los commits de los escenarios
        run: |
          git config --global init.defaultBranch main
          git config --global user.email "e2e@sdd-first.invalid"
          git config --global user.name "Suite e2e"
        shell: bash

      # `tests/e2e` ya no se linta aca: esta declarada en `dirs.tests_e2e`, asi
      # que la cubren los pasos naming/lint/format del pipeline, desde su SSOT
      # (SPEC-018 FR-US3-005). Queda solo la infraestructura compartida de la
      # raiz de `tests/`, que ninguna clave de `dirs` alcanza --hueco preexistente
      # registrado como V-4 en docs/IDEAS.md; `conftest.py` no lo lintaba nadie--.
      - name: Lint de la infraestructura compartida de tests
        run: python -m ruff check tests/conftest.py tests/fixtures_proyecto.py
        shell: bash

      - name: Escenarios e2e
        run: python -m pytest tests/e2e -q
        shell: bash

      # SC-002: el workspace vive fuera del arbol del kit, asi que la corrida no
      # deberia dejar nada aca. Sin este paso, esa promesa la sostenia la
      # revision manual.
      - name: La corrida no dejo residuo en el repositorio
        run: |
          residuo="$(git status --porcelain)"
          if [ -n "$residuo" ]; then
            echo "$residuo"
            echo "::error::la suite e2e dejo archivos en el repositorio (SPEC-018 SC-002)"
            exit 1
          fi
        shell: bash
