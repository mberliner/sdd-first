# Wiring del gate spec-first y los checks de proceso para el PROPIO kit
# (dogfooding, SPEC-002/SPEC-004). El código fuente del kit vive en core/ y
# adapters/. `language: python` (no `system`): pre-commit gestiona su propio
# intérprete aislado, así los hooks no dependen de que el shell invocador
# tenga `python` en el PATH (solo `python3`, ver docs/SDD-ENFORCEMENT.md).
repos:
  - repo: local
    hooks:
      - id: sdd-gate
        name: sdd gate (spec-first)
        entry: python core/sdd_gate.py
        language: python
        additional_dependencies: [pyyaml]
        pass_filenames: true
        files: '^(core|adapters)/'
      - id: sdd-traceability
        name: sdd traceability
        entry: python core/check_traceability.py specs
        language: python
        pass_filenames: false
        always_run: true
      - id: sdd-reset
        name: sdd-reset (limpia current-spec post-commit)
        entry: python core/sdd_reset.py
        language: python
        additional_dependencies: [pyyaml]
        stages: [post-commit]
        always_run: true
        pass_filenames: false
