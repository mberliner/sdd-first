# Config del propio sdd-first (dogfooding). El kit usa su propio SDD para evolucionar.
project:
  name: sdd-first
  domain: andamiaje SDD universal, agnostico y personalizable para otros proyectos
  language: python

dirs:
  # El "codigo fuente" del kit son sus scripts de nucleo y adaptadores.
  domain: core
  adapters: adapters
  tests_unit: tests/unit
  # La e2e es el nivel de test *primario* de un generador: el unico que ejercita
  # lo que el kit hace para otros, distinto de lo que hace sobre si mismo
  # (SPEC-018 US3). Declarada aca, la miran naming/lint/format; NO entra a la
  # corrida de `coverage` (los escenarios manejan el kit por subproceso).
  tests_e2e: tests/e2e
  source_roots: [core, adapters]

specs:
  # Triage de solape entre specs (SPEC-022 US2). Las stopwords son el
  # vocabulario propio de este dominio: aparece en casi todo titulo del kit, asi
  # que por si solo no dice nada sobre si dos specs se pisan.
  triage:
    stopwords:
      - spec
      - specs
      - sdd
      - first
      - proyecto
      - kit
    min_word_len: 4
    min_matches: 2

naming:
  # El kit maneja formatos (yaml/json) por diseno: no se prohiben esas palabras.
  # Se veta acoplamiento a proveedores/UI concretos en la propia herramienta.
  prohibited:
    - watson
    - streamlit
    - flask
    - django
    - gradio
    - oauth
    - jwt
    - apikey
  allowed_identifiers: []
  relax_in_tests: []

constitution:
  # Metadatos de CONSTITUTION.md. Bumpear al enmendar un principio y regenerar
  # con render.py (SPEC-010 FR-003); antes estaban hardcodeados en render.py.
  version: "0.4.0"
  ratified: 2026-08-02
  amended: 2026-08-08

principles:
  # `step` (opcional) nombra el paso de pipeline.steps que activa el enforcement:
  # check_constitution.py verifica que ese paso este cableado (SPEC-020 FR-001).
  # Omitirlo declara un enforcement que el pipeline NO activa -- ver III y IV.
  - id: I
    title: Nomenclatura agnostica a tecnologia
    invariant: Ningun identificador del kit acopla a un proveedor o UI concretos.
    enforcement: check_naming.py
    step: naming
    detail: specs/SPEC-000-naming.md
  - id: II
    title: Trazabilidad spec-codigo
    invariant: Toda capacidad del kit tiene spec registrada antes de implementar.
    enforcement: check_traceability.py
    step: traceability
    detail: specs/SPECS_REGISTRY.md
  - id: III
    title: Gate spec-first
    invariant: No se edita el nucleo del kit sin una spec vigente declarada.
    # Sin `step`: el gate se cablea via hooks (PreToolUse / pre-commit / plugin
    # de opencode), no como paso del pipeline, y su presencia la verifica
    # sdd-doctor.
    enforcement: sdd_gate.py
    detail: docs/SDD-ENFORCEMENT.md
  - id: IV
    title: SSOT unico por tema
    invariant: >-
      Toda pieza de informacion normativa —regla, definicion, cifra, tabla,
      convencion— vive en exactamente un documento, su SSOT; cualquier otro que
      la necesite la referencia, nunca la reproduce. El mismo invariante rige
      dentro de un documento: un detalle compartido por varias secciones se
      declara una vez y las secciones lo referencian.
    enforcement: AGENTS.md
    detail: 00-INDEX.md
  - id: V
    title: El kit se exige mas verificacion que la que reparte
    invariant: >-
      El kit no tiene codigo de producto: todo lo que contiene es codigo de
      palanca que se ejecuta dentro de proyectos ajenos, asi que un defecto suyo
      se multiplica por cada instalacion. Su cobertura de tests se mantiene por
      encima del piso que el kit le pide a un proyecto derivado, y el umbral solo
      sube: bajarlo es enmendar la constitucion, no ajustar una metrica.
    enforcement: pytest-cov
    step: coverage
    detail: .sdd/config.yaml

layers: {}

pipeline:
  # types/security: deuda (requieren trabajo de tipado/audit aparte, ver SPEC-002).
  steps:
    - hooks
    - traceability
    - naming
    - lint
    - format
    - skills
    - render
    - tests
    - coverage
    # Despues de los pasos que enforzan principios (naming, traceability,
    # coverage) y despues de render, que es su precondicion: asi verifica que
    # el enforcement de cada principio haya CORRIDO, no solo que este declarado
    # (SPEC-020 FR-US2-006). La posicion no es un capricho: es "despues del
    # ultimo paso de enforcement_steps", derivable del propio config.
    - constitution
    # Ultimo por costo, no por importancia: ~17 s contra los ~17 s del resto
    # del pipeline junto, asi que un fallo barato aparece antes.
    - e2e

  # Umbral de cobertura del propio kit: es el enforcement del Principio V, asi
  # que bajarlo no es aflojar una metrica sino enmendar la constitucion.
  # Medido 91% al cerrar K-3 (docs/IDEAS.md); el objetivo 90% se alcanzo
  # cubriendo los main() que la suite nunca ejecutaba.
  coverage:
    - paths: [core, adapters]
      min: 90
